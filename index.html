<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Soulbook — Fast Social Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jameel+Noori+Nastaleeq&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f3f4f6;
  --surface:rgba(255,255,255,.82);
  --solid:#fff;
  --ink:#09090b;
  --muted:#71717a;
  --soft:#f7f7f8;
  --line:rgba(9,9,11,.10);
  --line-strong:rgba(9,9,11,.16);
  --shadow:0 18px 60px rgba(0,0,0,.07);
  --shadow-sm:0 8px 25px rgba(0,0,0,.06);
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  background:
    radial-gradient(circle at 8% 0%,rgba(0,0,0,.045),transparent 28%),
    radial-gradient(circle at 95% 18%,rgba(0,0,0,.035),transparent 25%),
    var(--bg);
  color:var(--ink);min-height:100vh;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.glass{
  background:var(--surface);
  backdrop-filter:blur(25px) saturate(150%);
  -webkit-backdrop-filter:blur(25px) saturate(150%);
  border:1px solid rgba(255,255,255,.72);
  box-shadow:var(--shadow);
}
.app{width:min(1180px,calc(100% - 28px));margin:auto}
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(243,244,246,.78);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--line)
}
.topbar-inner{height:70px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:850;border:0;background:transparent;color:var(--ink)}
.brand-mark{width:38px;height:38px;border-radius:12px;background:#080808;color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.14)}
.nav{display:flex;align-items:center;gap:5px}
.nav button,.icon-btn{border:0;background:transparent;color:var(--muted);padding:9px;border-radius:11px}
.nav button:hover,.icon-btn:hover{background:rgba(0,0,0,.055);color:var(--ink)}
.primary{
  border:0;background:#080808;color:#fff;border-radius:12px;
  padding:10px 15px;font-weight:750;transition:.18s ease;
}
.primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;padding:24px 0 70px}
.sidebar{position:sticky;top:94px;height:max-content;padding:10px;border-radius:19px}
.side-btn{
  width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;
  padding:11px 12px;border-radius:12px;color:#52525b;text-align:left;font-weight:650;
}
.side-btn:hover,.side-btn.active{background:#09090b;color:#fff}
.side-note{font-size:10.5px;color:var(--muted);padding:13px 10px;line-height:1.6}
.feed{min-width:0;max-width:760px;width:100%;margin:auto}
.composer{border-radius:var(--r);padding:16px;margin-bottom:16px}
.composer-top{display:flex;gap:12px;align-items:flex-start}
.avatar{
  width:43px;height:43px;flex:0 0 43px;border-radius:50%;
  background:#111;color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;
  box-shadow:0 0 0 3px rgba(255,255,255,.9);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.composer-fields{flex:1;min-width:0}
.composer textarea{
  width:100%;border:0;background:transparent;resize:none;outline:0;
  min-height:66px;font-size:15px;line-height:1.65;padding:4px 0;
}
.composer-hashtags{margin-top:5px}
.composer-tools{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid var(--line);padding-top:11px;margin-top:7px
}
.tool-btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  background:rgba(255,255,255,.82);border-radius:11px;padding:8px 10px;color:#52525b;
}
.tool-btn:hover{border-color:var(--line-strong);color:#111;background:#fff}
.post{
  border-radius:var(--r);padding:16px;margin-bottom:13px;
  overflow:hidden;
}
.post-head{display:flex;align-items:center;gap:10px;min-width:0}
.post-user{min-width:0;flex:1}
.user-link{
  border:0;background:none;padding:0;font-weight:800;color:var(--ink);
  cursor:pointer;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.user-link:hover{text-decoration:underline}
.handle{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-time{font-size:10px;color:var(--muted);white-space:nowrap}
.post-menu{position:relative}
.post-menu-btn{border:0;background:transparent;padding:8px;border-radius:10px;color:var(--muted)}
.post-menu-btn:hover{background:rgba(0,0,0,.055);color:#111}
.post-menu-pop{
  position:absolute;right:0;top:39px;z-index:20;width:150px;padding:5px;
  background:#fff;border:1px solid var(--line);border-radius:13px;
  box-shadow:0 16px 40px rgba(0,0,0,.14);display:none
}
.post-menu-pop.open{display:block}
.post-menu-pop button{
  width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;
  padding:9px;border-radius:9px;text-align:left;font-size:12px;color:#333
}
.post-menu-pop button:hover{background:#f4f4f5}
.post-menu-pop .danger{color:#b91c1c}
.post-id{
  display:flex;align-items:center;gap:5px;max-width:100%;margin-top:3px;
  color:#a1a1aa;font-size:9px;line-height:1.2
}
.post-id code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post-id button{border:0;background:transparent;color:#71717a;padding:1px 3px;border-radius:5px}
.post-id button:hover{background:#f4f4f5;color:#111}
.post-body{
  margin:14px 2px 12px;line-height:1.78;font-size:15px;
  white-space:pre-wrap;overflow-wrap:anywhere
}
.media{border-radius:15px;overflow:hidden;background:#ededee;margin-top:8px;border:1px solid var(--line)}
.media img{display:block;width:100%;max-height:600px;object-fit:cover}
.hashtag-row{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 10px}
.hashtag{
  display:inline-flex;align-items:center;border:1px solid var(--line);
  background:#fff;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:750;color:#3f3f46
}
.post-actions{
  display:flex;align-items:center;gap:3px;border-top:1px solid var(--line);
  padding-top:8px;flex-wrap:wrap
}
.action{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  border:0;background:transparent;color:var(--muted);padding:8px 9px;
  border-radius:9px;font-size:11px;min-width:42px
}
.action:hover{background:rgba(0,0,0,.05);color:#111}
.action.liked{color:#111;font-weight:800;background:#f4f4f5}
.reactions{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 0}
.reaction{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 8px;font-size:11px}
.comment-box{display:flex;gap:7px;margin-top:9px}
.comment-box input{flex:1;min-width:0;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;outline:0;font-size:12px}
.comment-box input:focus{border-color:#111}
.comment-box .primary{padding:9px 11px}
.comments{display:grid;gap:7px;margin-top:9px}
.comment{padding:8px 10px;border-radius:11px;background:rgba(0,0,0,.035);font-size:11px}
.comment strong{font-size:10px}.comment p{margin-top:3px;line-height:1.5}
.profile{border-radius:var(--r);overflow:hidden}
.profile-cover{
  height:145px;
  background:
    radial-gradient(circle at 80% 25%,rgba(255,255,255,.16),transparent 30%),
    linear-gradient(135deg,#080808,#303033 52%,#f1f1f2);
}
.profile-main{padding:0 20px 20px}
.profile-avatar{
  margin-top:-38px;width:86px;height:86px;border:4px solid #fff;border-radius:50%;
  background:#111;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:800;overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,.12)
}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-end;margin-top:8px}
.profile-name{font-size:24px;font-weight:850;line-height:1.2}
.profile-handle{color:var(--muted);font-size:11px;margin-top:4px;word-break:break-all}
.profile-bio{margin-top:13px;line-height:1.7;color:#3f3f46;white-space:pre-wrap}
.profile-id-box{
  margin-top:10px;padding:9px 10px;border:1px solid var(--line);
  background:rgba(255,255,255,.7);border-radius:11px;display:flex;align-items:center;gap:7px
}
.profile-id-box span{font-size:9px;color:var(--muted);font-weight:750}
.profile-id-box code{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
.profile-stats>div{border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center;background:rgba(255,255,255,.45)}
.profile-stats b{display:block;font-size:16px}.profile-stats span{font-size:9px;color:var(--muted)}
.profile-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:16px}
.profile-tabs button{border:0;background:transparent;padding:10px 13px;color:var(--muted);font-weight:750;font-size:11px}
.profile-tabs button.active{color:#111;border-bottom:2px solid #111}
.modal{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:none;place-items:center;padding:14px
}
.modal.open{display:grid}
.modal-card{
  width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:20px;
  background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.7);
  box-shadow:0 30px 100px rgba(0,0,0,.25)
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.field{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:11px 12px;outline:0;margin:5px 0;font:inherit
}
.field:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,.045)}
.auth-tabs{display:flex;gap:6px;margin-bottom:13px}
.auth-tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px}
.auth-tabs button.active{background:#111;color:#fff}
.empty{text-align:center;padding:48px 20px;color:var(--muted);border-radius:18px}
.toast{position:fixed;right:16px;bottom:16px;z-index:200;background:#09090b;color:#fff;padding:11px 14px;border-radius:12px;font-size:11px;box-shadow:var(--shadow)}
.hidden{display:none!important}
.urdu,.urdu-text{font-family:"Jameel Noori Nastaleeq","Noto Nastaliq Urdu",serif;direction:rtl;text-align:right;font-size:1.08em}
@media(max-width:850px){
  .app{width:min(100% - 16px,760px)}
  .layout{grid-template-columns:1fr;gap:12px;padding-top:12px;padding-bottom:88px}
  .sidebar{
    position:fixed;bottom:9px;left:8px;right:8px;top:auto;z-index:40;
    padding:5px;border-radius:16px;display:flex;justify-content:space-around
  }
  .side-btn{width:auto;justify-content:center;padding:9px 12px;font-size:0}
  .side-btn svg{width:19px}.side-note{display:none}
  .topbar-inner{height:62px}.nav button.hide-mobile{display:none}
  .post,.composer{border-radius:17px;padding:13px}
  .feed{max-width:100%}
  .profile-head{align-items:flex-start;flex-direction:column}
  .profile-avatar{width:76px;height:76px}.profile-name{font-size:21px}
  .post-time{font-size:9px}
  .post-actions{justify-content:space-between}.action{padding:8px 6px;min-width:0;flex:1}
}
@media(max-width:520px){
  .brand{font-size:18px}.brand-mark{width:34px;height:34px}
  .composer-top{gap:9px}.avatar{width:38px;height:38px;flex-basis:38px}
  .composer textarea{min-height:58px;font-size:14px}
  .post-body{font-size:14px}.media img{max-height:470px}
  .profile-cover{height:125px}.profile-main{padding:0 14px 16px}
  .profile-id-box code{font-size:8px}
  .modal-card{padding:16px;border-radius:18px}
}
.feed-title-row{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}.feed-title-row strong{font-size:15px}.feed-title-row span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.analytics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.analytics-card{border:1px solid var(--line);border-radius:13px;padding:11px;background:rgba(255,255,255,.55)}
.analytics-card b{display:block;font-size:18px}.analytics-card span{font-size:9px;color:var(--muted)}
.analytics-post{border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:8px;background:#fff}
.analytics-post-top{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:750}
.analytics-post-meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:10px;margin-top:7px}
.online-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 2px #fff;margin-left:5px}
.last-seen{font-size:10px;color:var(--muted);margin-top:3px}
.notification-badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:#111;color:#fff;font-size:9px;margin-left:3px}
.notifications-list{display:grid;gap:7px}.notification-item{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:11px}
@media(max-width:700px){.analytics-grid{grid-template-columns:repeat(2,1fr)}}


.follow-btn.is-following{background:#fff;color:#111;border:1px solid var(--line)}
.profile-actions{display:flex;gap:7px}.profile-identity{min-width:0}.muted-profile{color:var(--muted);font-size:11px}
.profile-stats button{border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center;background:rgba(255,255,255,.45);cursor:pointer}
.profile-stats button:hover{background:#fff;border-color:var(--line-strong)}
.profile-stats button b,.profile-stats button span{display:block}
.profile-stats button b{font-size:16px}.profile-stats button span{font-size:9px;color:var(--muted)}
.follow-list{display:grid;gap:6px}.follow-list-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;background:transparent;border-radius:12px;text-align:left}
.follow-list-item:hover{background:#f4f4f5}.follow-list-item span{display:flex;flex-direction:column;min-width:0}.follow-list-item b{font-size:12px}.follow-list-item small{font-size:10px;color:var(--muted)}

/* ===== Soulbook responsive polish ===== */
html{overflow-x:hidden}
body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea{touch-action:manipulation}
.topbar-inner{min-width:0}
.nav{flex-shrink:0}
.nav .primary{white-space:nowrap}
.mobile-menu-btn{display:none;border:0;background:transparent;color:var(--ink);width:42px;height:42px;border-radius:12px;align-items:center;justify-content:center}
.mobile-menu-btn:hover{background:rgba(0,0,0,.06)}
.mobile-drawer{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.36);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:none}
.mobile-drawer.open{display:block}
.mobile-drawer-card{position:absolute;top:0;right:0;height:100%;width:min(310px,86vw);background:rgba(255,255,255,.98);box-shadow:-20px 0 60px rgba(0,0,0,.18);padding:78px 16px 20px;overflow:auto}
.mobile-drawer-close{position:absolute;top:18px;right:16px}
.mobile-drawer .side-btn{margin:4px 0}
.mobile-drawer .side-btn span{font-size:13px}
.mobile-drawer .side-note{display:block}
.comments{display:none!important}
.comment-count{font-weight:750}
.comment-modal-card{width:min(600px,100%);max-height:min(86vh,720px);display:flex;flex-direction:column}
.comment-list{display:grid;gap:9px;overflow:auto;padding:2px 2px 10px;min-height:90px}
.comment-item{display:flex;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:13px;background:rgba(0,0,0,.025)}
.comment-item .comment-avatar{width:34px;height:34px;flex:0 0 34px;border-radius:50%;overflow:hidden;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px}
.comment-item .comment-avatar img{width:100%;height:100%;object-fit:cover}
.comment-content{min-width:0;flex:1}.comment-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}.comment-meta b{font-size:11px}.comment-meta time{font-size:9px;color:var(--muted);white-space:nowrap}.comment-content p{font-size:12px;line-height:1.55;margin-top:3px;overflow-wrap:anywhere}
.comment-compose{display:flex;gap:7px;border-top:1px solid var(--line);padding-top:10px;margin-top:8px}.comment-compose input{flex:1;min-width:0}
.post-actions{gap:2px}.action{white-space:nowrap}
@media(min-width:851px){.feed{min-height:calc(100vh - 100px)}}
@media(max-width:850px){
  .app{width:calc(100% - 20px);max-width:none}
  .topbar-inner{height:60px;gap:7px}
  .topbar .nav{display:none}
  .mobile-menu-btn{display:inline-flex}
  .layout{display:block;padding:10px 0 24px}
  .sidebar{display:none}
  .feed{max-width:none}
  .composer{margin-bottom:12px}
  .post{margin-bottom:11px}
  .post-head{gap:8px}
  .post-user{min-width:0}
  .post-time{margin-left:auto;max-width:92px;overflow:hidden;text-overflow:ellipsis}
  .post-actions{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
  .action{width:100%;min-width:0;padding:8px 3px;font-size:10px;gap:3px}
  .action svg{width:15px;height:15px}
  .comment-box{display:none}
  .feed-title-row{margin-top:2px}
}
@media(max-width:520px){
  .app{width:calc(100% - 14px)}
  .brand{font-size:17px;min-width:0}.brand-mark{width:34px;height:34px;flex:0 0 34px}
  .topbar-inner{height:56px}
  .mobile-menu-btn{width:38px;height:38px}
  .composer,.post{padding:12px;border-radius:16px}
  .post-head .avatar{width:38px;height:38px;flex-basis:38px}
  .post-time{font-size:8.5px;max-width:78px}
  .post-body{font-size:14px;margin-top:11px}
  .media img{max-height:460px}
  .post-actions{grid-template-columns:repeat(6,minmax(0,1fr))}
  .action{font-size:9px;padding:8px 1px}
  .action svg{width:14px;height:14px}
  .comment-modal-card{padding:13px;border-radius:17px}
  .comment-item{padding:8px}.comment-compose{padding-top:9px}
}
@media(min-width:851px){
  .post-actions{padding-right:2px}
  .action{padding-left:8px;padding-right:8px}
}
/* Copy/drag deterrence. Editable controls remain usable. */
body.copy-protected,.copy-protected *{-webkit-user-select:none;user-select:none}
.copy-protected input,.copy-protected textarea,.copy-protected [contenteditable="true"],.copy-protected button,.copy-protected a{user-select:text}
img{-webkit-user-drag:none}
</style>
</head>
<body>
<header class="topbar">
  <div class="app topbar-inner">
    <button class="brand" onclick="showFeed()"><span class="brand-mark"><i data-lucide="book-open"></i></span><span>Soulbook</span></button>
    <div class="nav">
      <button onclick="showFeed()" title="Feed"><i data-lucide="house"></i></button>
      <button onclick="openMyProfile()" title="My profile"><i data-lucide="user"></i></button>
      <button onclick="openNotifications()" title="Notifications"><i data-lucide="bell"></i><span id="notificationBadge" class="notification-badge hidden">0</span></button>
      <button onclick="openProfileSettings()" title="Profile settings"><i data-lucide="settings"></i></button>
      <button onclick="openAuth()" id="authBtn" class="primary">Sign in</button>
    </div>
    <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Open navigation"><i data-lucide="menu"></i></button>
  </div>
</header>

<div class="mobile-drawer" id="mobileDrawer" onclick="if(event.target.id==='mobileDrawer')toggleMobileMenu(false)">
  <div class="mobile-drawer-card">
    <button class="icon-btn mobile-drawer-close" onclick="toggleMobileMenu(false)" aria-label="Close navigation"><i data-lucide="x"></i></button>
    <button class="side-btn active" onclick="mobileAction(showFeed)"><i data-lucide="rss"></i><span>Feed</span></button>

function friendlyError(error,fallback="Something went wrong. Please try again."){
  const raw=String(error?.message||error||"").toLowerCase();
  if(!navigator.onLine||raw.includes("failed to fetch")||raw.includes("networkerror")||raw.includes("network error")||raw.includes("load failed")||raw.includes("fetch failed")||raw.includes("offline")||raw.includes("timeout")) return "You lost your connection. Please check your internet and try again.";
  if(raw.includes("jwt")||raw.includes("token")||raw.includes("session")) return "Your session has expired. Please sign in again.";
  if(raw.includes("duplicate")||raw.includes("already exists")) return "This information is already in use.";
  if(raw.includes("permission")||raw.includes("not allowed")||raw.includes("row-level security")||raw.includes("violates row-level security")||raw.includes("forbidden")) return "You don't have permission to do that.";
  return fallback;
}
function showActionError(error,fallback){toast(friendlyError(error,fallback))}
const fmt=t=>{try{return new Date(t).toLocaleString([], {dateStyle:"medium",timeStyle:"short"})}catch{return ""}};
function avatarHtml(p,size="avatar"){const name=p?.display_name||p?.username||"U";return p?.avatar_url?`<div class="${size}"><img src="${esc(p.avatar_url)}"></div>`:`<div class="${size}">${esc(name.charAt(0).toUpperCase())}</div>`}
function renderIcons(){window.lucide?.createIcons?.()}

async function submitAuth(){
  const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value;
  if(!email||!password)return toast("Email and password are required.");
  if(authModeState==="login"){const r=await sb.auth.signInWithPassword({email,password});if(r.error)return showActionError(r.error)}
  else{
    const display=document.getElementById("authName").value.trim(),username=document.getElementById("authUsername").value.trim().toLowerCase().replace(/^@/,"");
    if(!display||!username)return toast("Display name and username are required.");
    const r=await sb.auth.signUp({email,password,options:{data:{display_name:display,username}}});
    if(r.error)return showActionError(r.error);
    if(r.data.user && !r.data.session)toast("Check your email to confirm your account.");
  }
  closeModal("authModal");await bootAuth();
}
async function bootAuth(){
  const r=await sb.auth.getSession();me=r.data.session?.user||null;
  document.getElementById("authBtn").textContent=me?"Sign out":"Sign in";const mal=document.getElementById("mobileAuthLabel");if(mal)mal.textContent=me?"Sign out":"Sign in";
  document.getElementById("authBtn").onclick=me?signOut:openAuth;
  if(me){
  await ensureProfile();
  const mini=document.getElementById("miniAvatar");
  if(mini){mini.outerHTML=avatarHtml(profile);const n=document.querySelector(".topbar .avatar");if(n)n.id="miniAvatar";}
}else{
  const mini=document.getElementById("miniAvatar");if(mini)mini.textContent="S";
}
}
async function signOut(){await sb.auth.signOut();location.reload()}
async function ensureProfile(){
  if(!me)return;
  let r=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();
  if(r.data){profile=r.data;return}
  const meta=me.user_metadata||{};
  const username=(meta.username||meta.display_name||me.email.split("@")[0]).toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30)||("user"+me.id.slice(0,8));
  r=await sb.from("profiles").insert({id:me.id,username,display_name:meta.display_name||username,bio:""}).select().single();
  if(r.error){
    const fallback="user_"+me.id.replace(/-/g,"").slice(0,12);
    const retry=await sb.from("profiles").insert({id:me.id,username:fallback,display_name:meta.display_name||fallback,bio:""}).select().single();
    if(retry.error){showActionError(retry.error);return} profile=retry.data; return;
  } profile=r.data;
}
async function loadAllPosts(){
  const pageSize=500; let from=0; const all=[];
  while(true){
    const r=await sb.from("posts").select("*").order("created_at",{ascending:false}).range(from,from+pageSize-1);
    if(r.error)throw r.error;
    all.push(...(r.data||[]));
    if(!r.data||r.data.length<pageSize)break;
    from+=pageSize;
    if(from>=5000)break;
  }
  return all;
}
async function loadFeed(){
  try{
    feed=await loadAllPosts();
    await hydrateInteractions(feed);
    renderFeed();
  }catch(e){
    document.getElementById("feedList").innerHTML=`<div class="empty glass"><strong>${navigator.onLine?"Something went wrong":"You lost your connection"}</strong><br><small>${navigator.onLine?"Please try again in a moment.":"Check your internet connection and try again."}</small></div>`;
  }
}
async function hydrateInteractions(posts){
  if(!posts.length)return;
  const ids=posts.map(x=>x.id);
  const userIds=[...new Set(posts.map(x=>x.user_id).filter(Boolean))];
  const [likes,reactions,comments,reposts,views,profiles]=await Promise.all([
    sb.from("post_likes").select("post_id,user_id").in("post_id",ids),
    sb.from("post_reactions").select("post_id,user_id,reaction").in("post_id",ids),
    sb.from("comments").select("id,post_id,user_id,body,created_at").in("post_id",ids).order("created_at",{ascending:true}),
    sb.from("post_reposts").select("post_id,user_id").in("post_id",ids),
    sb.from("post_views").select("post_id,user_id").in("post_id",ids),
    userIds.length?sb.from("profiles").select("id,username,display_name,avatar_url").in("id",userIds):Promise.resolve({data:[]})
  ]);
  const profileMap=new Map((profiles.data||[]).map(x=>[x.id,x]));
  const commentUserIds=[...new Set((comments.data||[]).map(x=>x.user_id).filter(Boolean))];
  const commentProfiles=commentUserIds.length?await sb.from("profiles").select("id,username,display_name,avatar_url").in("id",commentUserIds):{data:[]};
  const commentProfileMap=new Map((commentProfiles.data||[]).map(x=>[x.id,x]));
  posts.forEach(p=>{
    p._profile=profileMap.get(p.user_id)||null;
    p._likes=likes.data?.filter(x=>x.post_id===p.id)||[];
    p._reactions=reactions.data?.filter(x=>x.post_id===p.id)||[];
    p._comments=(comments.data?.filter(x=>x.post_id===p.id)||[]).map(c=>({...c,_profile:commentProfileMap.get(c.user_id)||null}));
    p._reposts=reposts.data?.filter(x=>x.post_id===p.id)||[];
    p._viewsCount=(views.data||[]).filter(x=>x.post_id===p.id).length;
  });
}
function renderFeed(){
  const root=document.getElementById("feedList");
  if(!feed.length){root.innerHTML='<div class="empty glass">No posts yet. Be the first to share something.</div>';return}
  root.innerHTML=feed.map(postCard).join("");renderIcons();applyUrdu();observePostViews();
}
function postCard(p){
  const u=p._profile||{id:p.user_id,username:p.author||"user",display_name:p.author||"User"};
  const tags=(p.hashtags||[]).map(t=>`<span class="hashtag">#${esc(String(t).replace(/^#/,""))}</span>`).join("");
  const liked=!!p._likes?.some(x=>x.user_id===me?.id),reposted=!!p._reposts?.some(x=>x.user_id===me?.id);
  const viewCount=p._viewsCount||0;
  const media=p.media_url && p.media_type?.startsWith("image/") ? `<div class="media"><img src="${esc(p.media_url)}" alt="Post photo" loading="lazy"></div>` : "";
  const reactions=["❤️","👍","😂","😢","🔥"].map(x=>{const n=p._reactions?.filter(r=>r.reaction===x).length||0;return n?`<button class="reaction" onclick="reactPost('${p.id}','${x}')">${x} ${n}</button>`:""}).join("");
  const owner=me?.id===p.user_id;
  return `<article class="post glass" id="post-${p.id}">
    <div class="post-head">
      ${avatarHtml(u)}
      <div class="post-user">
        <button class="user-link" onclick="openProfile('${u.id}')">${esc(u.display_name||u.username)}</button>
        <div class="handle">@${esc(u.username||"user")}</div>
        <div class="post-id"><code>${esc(u.id||p.user_id)}</code><button onclick="copyProfileId('${u.id||p.user_id}')" title="Copy user ID"><i data-lucide="copy"></i></button></div>
      </div>
      <span class="post-time">${fmt(p.created_at)}</span>
      ${owner?`<div class="post-menu">
        <button class="post-menu-btn" onclick="togglePostMenu('${p.id}',event)" title="Post options"><i data-lucide="more-horizontal"></i></button>
        <div class="post-menu-pop" id="post-menu-${p.id}">
          <button class="danger" onclick="deletePost('${p.id}')"><i data-lucide="trash-2"></i> Delete post</button>
        </div>
      </div>`:""}
    </div>
    ${p.body?`<div class="post-body ${isUrdu(p.body)?"urdu-text":""}">${esc(p.body)}</div>`:""}
    ${tags?`<div class="hashtag-row">${tags}</div>`:""}
    ${media}
    <div class="reactions">${reactions}</div>
    <div class="post-actions">
      <button class="action ${liked?"liked":""}" onclick="toggleLike('${p.id}')"><i data-lucide="heart"></i>${p._likes?.length||0}</button>
      <button class="action" onclick="openReaction('${p.id}')"><i data-lucide="smile-plus"></i>React</button>
      <button class="action" onclick="openComments('${p.id}')"><i data-lucide="message-circle"></i><span class="comment-count">${p._comments?.length||0}</span></button>
      <button class="action" onclick="sharePost('${p.id}')"><i data-lucide="share-2"></i>Share</button>
      <span class="action" style="cursor:default"><i data-lucide="eye"></i>${viewCount}</span>
      <button class="action ${reposted?"liked":""}" onclick="toggleRepost('${p.id}')"><i data-lucide="repeat-2"></i>${p._reposts?.length||0}</button>
    </div>
  </article>`;
}
function togglePostMenu(id,e){
  e?.stopPropagation();
  document.querySelectorAll(".post-menu-pop.open").forEach(x=>{if(x.id!=="post-menu-"+id)x.classList.remove("open")});
  document.getElementById("post-menu-"+id)?.classList.toggle("open");
}
document.addEventListener("click",()=>document.querySelectorAll(".post-menu-pop.open").forEach(x=>x.classList.remove("open")));
async function deletePost(id){
  if(!me)return openAuth();
  const post=feed.find(x=>x.id===id);
  if(!post||post.user_id!==me.id)return toast("You can only delete your own post.");
  if(!confirm("Delete this post permanently?"))return;
  try{
    const r=await sb.from("posts").delete().eq("id",id).eq("user_id",me.id);
    if(r.error)throw r.error;
    if(post.media_url){
      const marker="/storage/v1/object/public/post-media/";
      const i=post.media_url.indexOf(marker);
      if(i>=0){
        const path=decodeURIComponent(post.media_url.slice(i+marker.length));
        await sb.storage.from("post-media").remove([path]);
      }
    }
    toast("Post deleted.");
    if(activeProfileId)await openProfile(activeProfileId); else await loadFeed();
  }catch(e){showActionError(e)}
}
function applyUrdu(){document.querySelectorAll(".post-body,.comment p").forEach(e=>{if(isUrdu(e.textContent))e.classList.add("urdu-text")})}
async function toggleLike(id){if(!me)return openAuth();const has=feed.find(p=>p.id===id)?._likes?.some(x=>x.user_id===me.id);const r=has?await sb.from("post_likes").delete().eq("post_id",id).eq("user_id",me.id):await sb.from("post_likes").insert({post_id:id,user_id:me.id});if(r.error)return showActionError(r.error);const p=feed.find(x=>x.id===id);if(p&&!has)await createNotification(p.user_id,"like","liked your post",id);await loadFeed()}
function openReaction(id){if(!me)return openAuth();activeReactionPost=id;document.getElementById("reactionChoices").innerHTML=["❤️","👍","😂","😢","🔥","😍","👏","🙏","💯","😮"].map(x=>`<button class="reaction" onclick="reactPost('${id}','${x}');closeModal('reactionModal')">${x}</button>`).join("");document.getElementById("reactionModal").classList.add("open")}
async function reactPost(id,reaction){if(!me)return openAuth();const old=feed.find(p=>p.id===id)?._reactions?.find(x=>x.user_id===me.id);let r;if(old?.reaction===reaction)r=await sb.from("post_reactions").delete().eq("post_id",id).eq("user_id",me.id);else r=await sb.from("post_reactions").upsert({post_id:id,user_id:me.id,reaction},{onConflict:"post_id,user_id"});if(r.error)return showActionError(r.error);const p=feed.find(x=>x.id===id);if(p&&old?.reaction!==reaction)await createNotification(p.user_id,"reaction",`reacted ${reaction} to your post`,id);await loadFeed()}
let activeCommentPost=null;

  const root=document.getElementById("commentList");

  document.getElementById("commentsSubtitle").textContent=`${rows.length} comment${rows.length===1?"":"s"}`;
  root.innerHTML=rows.length?rows.map(c=>{const u=c._profile||{};return `<div class="comment-item">${avatarHtml(u,"comment-avatar")}<div class="comment-content"><div class="comment-meta"><b>@${esc(u.username||"user")}</b><time>${fmt(c.created_at)}</time></div><p class="${isUrdu(c.body)?"urdu-text":""}">${esc(c.body)}</p></div></div>`}).join(""):'<div class="empty">No comments yet. Be the first to comment.</div>';
  renderIcons();applyUrdu();

function focusComment(id){openComments(id)}
async function toggleRepost(id){if(!me)return openAuth();const has=feed.find(p=>p.id===id)?._reposts?.some(x=>x.user_id===me.id);const r=has?await sb.from("post_reposts").delete().eq("post_id",id).eq("user_id",me.id):await sb.from("post_reposts").insert({post_id:id,user_id:me.id});if(r.error)return showActionError(r.error);await loadFeed()}
async function sharePost(id){const url=location.href.split("#")[0]+"#post-"+id;try{if(navigator.share)await navigator.share({title:"Soulbook post",url});else{await navigator.clipboard.writeText(url);toast("Post link copied.")}}catch{}}
async function uploadMedia(file){
  if(!file)return null;
  if(!file.type.startsWith("image/"))throw new Error("Only photos/images are supported.");
  const path=`${me.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"")}`;
  const r=await sb.storage.from("post-media").upload(path,file,{contentType:file.type,upsert:false});
  if(r.error)throw r.error;
  return {url:sb.storage.from("post-media").getPublicUrl(path).data.publicUrl,type:file.type};
}
async function publishPost(){
  if(!me)return openAuth();const body=document.getElementById("postText").value.trim(),hashtags=parseHashtags(document.getElementById("postHashtags").value),file=document.getElementById("postMedia").files[0];if(!body&&!file)return toast("Write something or attach media.");
  try{let media=null;if(file)media=await uploadMedia(file);const r=await sb.from("posts").insert({user_id:me.id,body,hashtags,media_url:media?.url||null,media_type:media?.type||null}).select().single();if(r.error)throw r.error;document.getElementById("postText").value="";document.getElementById("postHashtags").value="";document.getElementById("postMedia").value="";closeModal("composerModal");toast("Posted.");renderIcons();await notifyFollowers(r.data?.id);await loadFeed()}catch(e){showActionError(e)}
}
async function publishQuickPost(){const body=document.getElementById("quickText").value.trim(),hashtags=parseHashtags(document.getElementById("quickHashtags").value),file=document.getElementById("quickMedia").files[0];if(!body&&!file)return openComposer();if(!me)return openAuth();try{let media=null;if(file)media=await uploadMedia(file);const r=await sb.from("posts").insert({user_id:me.id,body,hashtags,media_url:media?.url||null,media_type:media?.type||null});if(r.error)throw r.error;document.getElementById("quickText").value="";document.getElementById("quickHashtags").value="";document.getElementById("quickMedia").value="";toast("Posted.");await notifyFollowers(r.data?.id);await loadFeed()}catch(e){showActionError(e)}}
async function notifyFollowers(postId){
  if(!me)return;
  const r=await sb.from("follows").select("follower_id").eq("following_id",me.id);
  if(r.error)return;
  const rows=r.data||[];
  if(rows.length)await sb.from("notifications").insert(rows.map(x=>({user_id:x.follower_id,actor_id:me.id,type:"new_post",message:`shared a new post`,post_id:postId})));
}
function parseHashtags(input){return [...new Set(String(input||"").match(/#[\p{L}\p{N}_]+/gu)||[])].map(x=>x.slice(1).toLowerCase()).slice(0,20)}
function settingsAvatarMarkup(p){return p?.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc((p?.display_name||p?.username||"U").charAt(0).toUpperCase())}
async function openProfileSettings(){if(!me)return openAuth();const r=await sb.from("profiles").select("id,username,display_name,bio,avatar_url").eq("id",me.id).single();if(r.error)return showActionError(r.error);document.getElementById("settingsDisplayName").value=r.data.display_name||"";document.getElementById("settingsUsername").value=r.data.username||"";document.getElementById("settingsBio").value=r.data.bio||"";document.getElementById("settingsAvatarPreview").innerHTML=settingsAvatarMarkup(r.data);document.getElementById("profileSettingsModal").classList.add("open");renderIcons()}
async function removeProfilePhoto(){
  if(!me)return;
  if(!confirm("Remove your profile photo?"))return;
  const r=await sb.from("profiles").update({avatar_url:null}).eq("id",me.id);
  if(r.error)return showActionError(r.error);
  profile.avatar_url=null;
  document.getElementById("settingsAvatarPreview").innerHTML=settingsAvatarMarkup(profile);
  document.getElementById("settingsAvatarFile").value="";
  toast("Profile photo removed.");
}
function previewProfilePhoto(input){const f=input.files?.[0];if(!f)return;if(!f.type.startsWith("image/")){input.value="";return toast("Please select an image.")}const r=new FileReader();r.onload=()=>document.getElementById("settingsAvatarPreview").innerHTML=`<img src="${r.result}" alt="">`;r.readAsDataURL(f)}
async function saveProfileSettings(){if(!me)return openAuth();const display_name=document.getElementById("settingsDisplayName").value.trim();const username=document.getElementById("settingsUsername").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");const bio=document.getElementById("settingsBio").value.trim();const file=document.getElementById("settingsAvatarFile").files?.[0];if(!display_name)return toast("Display name is required.");if(!/^[a-z0-9_]{3,24}$/.test(username))return toast("Username: 3–24 characters, a-z 0-9 _");const exists=await sb.from("profiles").select("id").eq("username",username).neq("id",me.id).maybeSingle();if(exists.error)return showActionError(exists.error);if(exists.data)return toast("Username already taken.");try{let avatar_url;if(file){if(!file.type.startsWith("image/"))throw new Error("Profile photo must be an image.");if(file.size>5*1024*1024)throw new Error("Profile photo must be 5MB or smaller.");const path=`${me.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,"")}`;const up=await sb.storage.from("avatars").upload(path,file,{contentType:file.type,upsert:false});if(up.error)throw up.error;avatar_url=sb.storage.from("avatars").getPublicUrl(path).data.publicUrl}const payload={display_name,username,bio};if(avatar_url)payload.avatar_url=avatar_url;const u=await sb.from("profiles").update(payload).eq("id",me.id).select().single();if(u.error)throw u.error;closeModal("profileSettingsModal");toast("Profile updated.");await loadFeed();await openProfile(me.id)}catch(e){showActionError(e)}}
async function copyProfileId(id){try{await navigator.clipboard.writeText(id);toast("Profile ID copied.")}catch{toast(id)}}
async function getProfile(id){
  const r=await sb.from("profiles").select("id,username,display_name,bio,avatar_url,created_at,last_seen_at").eq("id",id).maybeSingle();
  if(r.error)throw r.error;
  if(r.data)return r.data;
  if(me?.id===id){
    const m=me.user_metadata||{};
    return {
      id:me.id,
      username:(m.username||me.email?.split("@")[0]||"user").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,24)||"user",
      display_name:m.display_name||m.name||"User",
      bio:"",
      avatar_url:null
    };
  }
  return null;
}
function profileActionButton(id,following){
  if(!me)return `<button class="primary" onclick="openAuth()">Follow</button>`;
  if(me.id===id)return `<button class="primary" onclick="openProfileSettings()"><i data-lucide="pencil"></i> Edit profile</button>`;
  return `<button class="primary follow-btn ${following?"is-following":""}" onclick="toggleFollow('${id}',${following})"><i data-lucide="${following?"user-check":"user-plus"}"></i>${following?"Following":"Follow"}</button>`;
}
async function openProfile(id){
  activeProfileId=id;
  document.getElementById("feedView").classList.add("hidden");
  document.getElementById("profileView").classList.remove("hidden");
  document.getElementById("feedSide").classList.remove("active");
  const root=document.getElementById("profileView");
  root.innerHTML='<div class="empty glass">Loading profile…</div>';
  try{
    const p=await getProfile(id);
    if(!p){
      root.innerHTML='<div class="empty glass">This profile could not be found.</div>';
      return;
    }
    const postsR=await sb.from("posts").select("*").eq("user_id",id).order("created_at",{ascending:false});
    if(postsR.error)throw postsR.error;
    const followRows=me?await sb.from("follows").select("follower_id,following_id").or(`and(follower_id.eq.${me.id},following_id.eq.${id}),and(follower_id.eq.${id},following_id.eq.${me.id})`):{data:[]};
    if(followRows.error)throw followRows.error;
    const rows=followRows.data||[];
    const following=!!me&&rows.some(x=>x.follower_id===me.id&&x.following_id===id);
    const followerCount=(await sb.from("follows").select("id",{count:"exact",head:true}).eq("following_id",id)).count||0;
    const followingCount=(await sb.from("follows").select("id",{count:"exact",head:true}).eq("follower_id",id)).count||0;
    const mine=postsR.data||[];
    await hydrateInteractions(mine);
    const displayName=p.display_name||p.username||"User";
    const username=p.username||"user";
    root.innerHTML=`<div class="profile glass">
      <div class="profile-cover"></div>
      <div class="profile-main">
        ${avatarHtml(p,"profile-avatar")}
        <div class="profile-head">
          <div class="profile-identity">
            <div class="profile-name">${esc(displayName)} ${isUserOnline(id)?'<span class="online-dot" title="Online"></span>':''}</div>
            <div class="profile-handle">@${esc(username)}</div>
            <div class="last-seen">${isUserOnline(id)?'Active now':p.last_seen_at?'Last seen '+fmt(p.last_seen_at):'Last seen unavailable'}</div>
          </div>
          <div class="profile-actions">${profileActionButton(id,following)}</div>
        </div>
        ${p.bio?`<div class="profile-bio ${isUrdu(p.bio)?"urdu-text":""}">${esc(p.bio)}</div>`:"<div class=\"profile-bio muted-profile\">No bio added yet.</div>"}
        <div class="profile-id-box">
          <span>USER ID</span><code>${esc(p.id)}</code>
          <button class="icon-btn" style="padding:4px" onclick="copyProfileId('${p.id}')" title="Copy ID"><i data-lucide="copy"></i></button>
        </div>
        <div class="profile-stats">
          <button onclick="showFollowList('${id}','followers')"><b>${followerCount}</b><span>Followers</span></button>
          <button onclick="showFollowList('${id}','following')"><b>${followingCount}</b><span>Following</span></button>
          <div><b>${mine.length}</b><span>Posts</span></div>
        </div>
        <div class="profile-tabs"><button class="active">Posts</button></div>
      </div>
    </div>
    <div style="margin-top:14px">
      <div class="feed-title-row">
        <div><strong>All posts by @${esc(username)}</strong><span>${mine.length} post${mine.length===1?"":"s"} • Live</span></div>
        <button class="icon-btn" onclick="openProfile('${id}')" title="Refresh profile"><i data-lucide="refresh-cw"></i></button>
      </div>
      ${mine.length?mine.map(postCard).join(""):'<div class="empty glass">No posts yet.</div>'}
    </div>`;
    renderIcons();applyUrdu();
  }catch(e){
    root.innerHTML=`<div class="empty glass"><strong>${navigator.onLine?"Something went wrong":"You lost your connection"}</strong><br><small>${navigator.onLine?"Please try again in a moment.":"Check your internet connection and try again."}</small></div>`;
  }
}
async function showFollowList(profileId,type){
  const column=type==="followers"?"following_id":"follower_id";
  const r=await sb.from("follows").select("follower_id,following_id").eq(column,profileId);
  if(r.error)return showActionError(r.error);
  const ids=[...new Set((r.data||[]).map(x=>type==="followers"?x.follower_id:x.following_id))];
  if(!ids.length)return toast(type==="followers"?"No followers yet.":"Not following anyone yet.");
  const p=await sb.from("profiles").select("id,username,display_name,avatar_url").in("id",ids);
  if(p.error)return showActionError(p.error);
  const lines=(p.data||[]).map(x=>`<button class="follow-list-item" onclick="closeModal('followListModal');openProfile('${x.id}')">${avatarHtml(x,"avatar")}<span><b>${esc(x.display_name||x.username)}</b><small>@${esc(x.username||"user")}</small></span></button>`).join("");
  document.getElementById("followListTitle").textContent=type==="followers"?"Followers":"Following";
  document.getElementById("followListBody").innerHTML=lines||'<div class="empty">No profiles found.</div>';
  document.getElementById("followListModal").classList.add("open");renderIcons();
}

function isUserOnline(id){return !!window.__onlineUsers?.has(id)}
async function trackPostView(id){
  if(!me||viewedPosts.has(id))return;
  viewedPosts.add(id);
  const r=await sb.from("post_views").upsert({post_id:id,user_id:me.id},{onConflict:"post_id,user_id"});
  if(r.error)showActionError(r.error);
}
function observePostViews(){
  document.querySelectorAll(".post").forEach(el=>{
    if(el.dataset.viewObserved)return;
    el.dataset.viewObserved="1";
    const id=el.id.replace("post-","");
    const io=new IntersectionObserver(entries=>entries.forEach(x=>{if(x.isIntersecting){trackPostView(id);io.disconnect()}}),{threshold:.5});
    io.observe(el);
  });
}
async function refreshViewCounts(){
  const ids=feed.map(x=>x.id).filter(Boolean);if(!ids.length)return;
  const r=await sb.from("post_views").select("post_id").in("post_id",ids);if(r.error)return;
  const counts=new Map();(r.data||[]).forEach(x=>counts.set(x.post_id,(counts.get(x.post_id)||0)+1));
  feed.forEach(p=>p._viewsCount=counts.get(p.id)||0);
  document.querySelectorAll(".post").forEach(el=>{const id=el.id.replace("post-","");const eye=[...el.querySelectorAll(".action")].find(x=>x.querySelector("svg.lucide-eye"));if(eye)eye.lastChild.textContent=String(counts.get(id)||0)});
}
async function loadNotifications(){
  if(!me)return;
  const r=await sb.from("notifications").select("id,type,message,post_id,actor_id,created_at,read").eq("user_id",me.id).order("created_at",{ascending:false}).limit(50);
  if(r.error)return;
  const rows=r.data||[];
  notificationUnread=rows.filter(x=>!x.read).length;
  const b=document.getElementById("notificationBadge");
  if(b){b.textContent=notificationUnread;b.classList.toggle("hidden",!notificationUnread)}
  const actorIds=[...new Set(rows.map(x=>x.actor_id).filter(Boolean))];
  const pr=actorIds.length?await sb.from("profiles").select("id,username,display_name").in("id",actorIds):{data:[]};
  const pm=new Map((pr.data||[]).map(x=>[x.id,x]));
  const root=document.getElementById("notificationsList");
  if(root)root.innerHTML=rows.length?rows.map(n=>`<div class="notification-item"><b>${esc(pm.get(n.actor_id)?.display_name||"Someone")}</b> ${esc(n.message||"You have a new notification.")}<div class="last-seen">${fmt(n.created_at)}</div></div>`).join(""):'<div class="empty">No notifications yet.</div>';
}
async function openNotifications(){
  if(!me)return openAuth();
  document.getElementById("notificationsModal").classList.add("open");
  await loadNotifications();
  await sb.from("notifications").update({read:true}).eq("user_id",me.id).eq("read",false);
  notificationUnread=0;
  document.getElementById("notificationBadge")?.classList.add("hidden");
  await loadNotifications();
}
async function createNotification(user_id,type,message,post_id=null){
  if(!me||!user_id||user_id===me.id)return;
  await sb.from("notifications").insert({user_id,actor_id:me.id,type,message,post_id});
}
async function openAnalytics(){
  if(!me)return openAuth();
  closeModal("profileSettingsModal");
  const root=document.getElementById("analyticsRoot");root.innerHTML='<div class="empty">Loading analytics…</div>';
  document.getElementById("analyticsModal").classList.add("open");
  const pr=await sb.from("posts").select("id,body,created_at").eq("user_id",me.id).order("created_at",{ascending:false});
  if(pr.error)return root.innerHTML=`<div class="empty"><strong>Something went wrong</strong><br><small>${friendlyError(pr.error)}</small></div>`;
  const posts=pr.data||[], ids=posts.map(x=>x.id);
  if(!ids.length){root.innerHTML='<div class="empty">No posts yet, so there is no analytics data.</div>';return}
  const [v,l,r,c]=await Promise.all([
    sb.from("post_views").select("post_id").in("post_id",ids),
    sb.from("post_likes").select("post_id").in("post_id",ids),
    sb.from("post_reactions").select("post_id,reaction").in("post_id",ids),
    sb.from("comments").select("post_id").in("post_id",ids)
  ]);
  const totalViews=(v.data||[]).length,totalLikes=(l.data||[]).length,totalReacts=(r.data||[]).length,totalComments=(c.data||[]).length;
  root.innerHTML=`<div class="analytics-grid">
    <div class="analytics-card"><b>${totalViews}</b><span>Total views</span></div>
    <div class="analytics-card"><b>${totalLikes}</b><span>Total likes</span></div>
    <div class="analytics-card"><b>${totalReacts}</b><span>Total reactions</span></div>
    <div class="analytics-card"><b>${totalComments}</b><span>Total comments</span></div>
  </div>
  <div style="margin-top:14px"><strong>Post analytics</strong>${posts.map(p=>{
    const vv=(v.data||[]).filter(x=>x.post_id===p.id).length,ll=(l.data||[]).filter(x=>x.post_id===p.id).length,rr=(r.data||[]).filter(x=>x.post_id===p.id).length,cc=(c.data||[]).filter(x=>x.post_id===p.id).length;
    return `<div class="analytics-post"><div class="analytics-post-top"><span>${esc((p.body||"Photo post").slice(0,80))}</span><span>${fmt(p.created_at)}</span></div><div class="analytics-post-meta"><span>👁 ${vv} views</span><span>♥ ${ll} likes</span><span>☺ ${rr} reactions</span><span>💬 ${cc} comments</span></div></div>`
  }).join("")}</div>`;
}
function startPresence(){
  window.__onlineUsers=window.__onlineUsers||new Set();
  if(presenceChannel)sb.removeChannel(presenceChannel);
  presenceChannel=sb.channel("soulbook-presence",{config:{presence:{key:me?.id||crypto.randomUUID()}}});
  presenceChannel.on("presence",{event:"sync"},()=>{const state=presenceChannel.presenceState();window.__onlineUsers=new Set(Object.values(state).flat().map(x=>x.user_id).filter(Boolean));if(activeProfileId)openProfile(activeProfileId)});
  presenceChannel.on("presence",{event:"join",callback:()=>{}});
  presenceChannel.on("presence",{event:"leave",callback:()=>{}});
  presenceChannel.subscribe(async status=>{if(status==="SUBSCRIBED"&&me)await presenceChannel.track({user_id:me.id,last_seen_at:new Date().toISOString()})});
}
async function updateLastSeen(){
  if(!me)return;
  await sb.from("profiles").update({last_seen_at:new Date().toISOString()}).eq("id",me.id);
}
async function toggleFollow(id,isFollowing){
  if(!me)return openAuth();
  if(me.id===id)return toast("You cannot follow your own profile.");
  const r=isFollowing
    ?await sb.from("follows").delete().eq("follower_id",me.id).eq("following_id",id)
    :await sb.from("follows").insert({follower_id:me.id,following_id:id});
  if(r.error)return showActionError(r.error);
  toast(isFollowing?"Unfollowed.":"Following.");
  if(!isFollowing)await createNotification(id,"follow","started following you");
  await openProfile(id);
}
async function openMyProfile(){if(!me)return openAuth();await openProfile(me.id)}
function toggleMobileMenu(force){
  const d=document.getElementById("mobileDrawer");if(!d)return;
  const open=force===undefined?!d.classList.contains("open"):!!force;
  d.classList.toggle("open",open);document.body.style.overflow=open?"hidden":"";renderIcons();
}
function mobileAction(fn){toggleMobileMenu(false);setTimeout(()=>fn(),60)}
function mobileAuthAction(){toggleMobileMenu(false);setTimeout(()=>{if(me)signOut();else openAuth()},60)}
function installCopyProtection(){
  document.body.classList.add("copy-protected");
  document.addEventListener("contextmenu",e=>{if(!e.target.closest("input,textarea,button,a,[contenteditable='true']"))e.preventDefault()},{capture:true});
  document.addEventListener("dragstart",e=>{if(!e.target.closest("input,textarea,button,a"))e.preventDefault()},{capture:true});
  document.addEventListener("selectstart",e=>{if(!e.target.closest("input,textarea,button,a,[contenteditable='true']"))e.preventDefault()},{capture:true});
  document.addEventListener("copy",e=>{if(!e.target.closest("input,textarea,[contenteditable='true']"))e.preventDefault()},{capture:true});
  document.addEventListener("cut",e=>{if(!e.target.closest("input,textarea,[contenteditable='true']"))e.preventDefault()},{capture:true});
  document.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase(),mod=e.ctrlKey||e.metaKey;
    if(mod&&(k==='u'||k==='s'||k==='c'||k==='x'||k==='a')){if(!e.target.closest("input,textarea,[contenteditable='true']")){e.preventDefault();e.stopPropagation()}}
    if(e.key==='F12'||(mod&&e.shiftKey&&['i','j','c'].includes(k))){e.preventDefault();e.stopPropagation()}
  },{capture:true});
}

function startRealtime(){
  if(realtime)sb.removeChannel(realtime);
  realtime=sb.channel("soulbook-live-social")
    .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},async()=>{
      await loadFeed();
      if(activeProfileId)await openProfile(activeProfileId);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"posts"},async()=>{
      await loadFeed();
      if(activeProfileId)await openProfile(activeProfileId);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"follows"},async()=>{
      await loadFeed();
      if(activeProfileId)await openProfile(activeProfileId);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"post_likes"},async()=>{
      await loadFeed();
      if(activeProfileId)await openProfile(activeProfileId);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"post_reactions"},async()=>{
      await loadFeed();
      if(activeProfileId)await openProfile(activeProfileId);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"comments"},async()=>{
      await loadFeed();
      if(activeCommentPost){const cp=feed.find(x=>x.id===activeCommentPost);if(cp&&document.getElementById("commentsModal")?.classList.contains("open"))renderCommentList(cp)}
      if(activeProfileId)await openProfile(activeProfileId);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"post_reposts"},async()=>{
      await loadFeed();
      if(activeProfileId)await openProfile(activeProfileId);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"post_views"},async()=>{
      if(document.getElementById("analyticsModal")?.classList.contains("open"))openAnalytics();
      clearTimeout(window.__viewRefreshTimer);
      window.__viewRefreshTimer=setTimeout(()=>refreshViewCounts(),1200);
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"notifications"},async(payload)=>{
      if(payload.new?.user_id===me?.id){
        await loadNotifications();
        if(payload.eventType==="INSERT")toast("New notification");
      }
    })
    .subscribe((status)=>{
      if(status==="CHANNEL_ERROR")showActionError(new Error("network error"),"Live connection interrupted. Please check your internet and try again.");
    });
}
sb.auth.onAuthStateChange(async()=>{await bootAuth();startRealtime();if(me)updateLastSeen()});
setInterval(()=>{if(me)updateLastSeen()},30000);
window.addEventListener("beforeunload",()=>{if(me)updateLastSeen()});
window.addEventListener("offline",()=>toast("You lost your connection. Please check your internet."));
window.addEventListener("online",()=>toast("Network connection restored."));
(async()=>{renderIcons();installCopyProtection();authMode("login");await bootAuth();await loadFeed();startRealtime()})();
</script>
